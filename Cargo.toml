[package]
name = "avif-rust"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Experimental pure Rust AVIF container and AV1 image-sequence decoder"
keywords = ["avif", "av1", "image", "decoder", "codec"]
categories = ["multimedia::images", "encoding"]
license = "MIT"
repository = "https://github.com/mith-mmk/avif-rust.git"
include = [
    "/src/**",
    "/CHANGELOG.md",
    "/README.md",
    "/README.ja.md",
    "/LICENSE",
    "/SHARED_BUFFER.md",
    "/PACKAGING.md",
    "/scripts/verify-packages.py",
    "/benches/**",
    "/tests/avis_regression.rs",
    "/tests/avis-subsampled-palette.avif",
    "/tests/avis-subsampled-key-reference.yuv",
    "/tests/avis-subsampled-reference.yuv",
    "/tests/lossless-sub8x8-palette.avif",
    "/tests/lossless-sub8x8-palette.yuv",
    "/tests/shared_buffer.rs",
    "/tests/shared_transcode.rs",
    "/tests/shared_oracles.py",
    "/tests/WML2Viewer.avif",
    "/tests/plum-blossom-small.profile1.8bpc.yuv444.alpha-full.avif",
    "/tests/FIXTURES.md",
    "/tests/native_pixel_conformance.rs",
    "/tests/native-pixel/**",
]

[dependencies]
bin-rs = { version = "0.0.10", features = ["stream", "util"] }
avif-image-buffer = { version = "0.1.0", git = "https://github.com/mith-mmk/avif-rust.git", rev = "5c73c7f26c276098ddd761fb20b956302a462001" }
avifenc_codec = { package = "avifenc-rust", version = "0.1.2", git = "https://github.com/mith-mmk/avifenc.git", rev = "342d36fd8219ab87ff5561daa58489e5d3bd88e0", optional = true, default-features = false }

[features]
encode = ["dep:avifenc_codec"]

[lints.clippy]
# AV1 syntax and reconstruction functions intentionally mirror normative
# parameter groups. Keeping those values explicit is easier to audit against
# the specification than hiding them behind decoder-specific argument bags.
too_many_arguments = "allow"
type_complexity = "allow"

# Keep this nested repository independent when it is checked out inside WML2.
[workspace]
exclude = ["crates/avif-image-buffer", "tests/wasm_shared"]
resolver = "2"

[[bench]]
name = "decode"
harness = false
